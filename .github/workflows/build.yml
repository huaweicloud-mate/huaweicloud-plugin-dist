name: build

# Build per-agent plugin packages from the upstream huaweicloud/huaweicloud-devkit
# source repo (where the npm package is published from), commit them under
# dist/<agent>/, and publish GitHub Releases with the zips.
#
# Version is resolved from the npm registry (`npm view huaweicloud-devkit version`)
# so the package version always matches the published npm package.
#
# Triggers:
#   - workflow_dispatch: manual, with inputs (source repo / ref / version)
#   - repository_dispatch (types: [plugin-release]): sent when a release is cut.
#     Payload: { "client_payload": { "ref": "...", "version": "..." } }
#
# Official channel submission (e.g. WorkBuddy store upload) is currently a
# console/manual step: download the Release zip asset and upload it there.
# When an official submission API exists, add a "publish-*" job below.

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repo (huaweicloud-devkit checkout to package)'
        default: 'huaweicloud/huaweicloud-devkit'
        required: true
      ref:
        description: 'Git ref of the source repo to package (branch/tag/SHA)'
        default: 'dev'
        required: true
      version:
        description: 'Version to stamp (defaults to the npm registry version of huaweicloud-devkit)'
        required: false
  repository_dispatch:
    types: [plugin-release]

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event_name }}
  cancel-in-progress: false

jobs:
  build-workbuddy:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repo || 'huaweicloud/huaweicloud-devkit' }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.client_payload.ref || 'dev' }}
      INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}
    steps:
      - name: Checkout dist repo
        uses: actions/checkout@v4

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: main-src

      - name: Resolve version
        id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # npm registry is the single source of truth for the package version
            VERSION=$(npm view huaweicloud-devkit version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WorkBuddy package at version $VERSION (source: $SOURCE_REPO@$SOURCE_REF)"

      - name: Build WorkBuddy expert package
        run: node scripts/build-workbuddy.mjs --source main-src --version "${{ steps.version.outputs.version }}"

      - name: Zip package
        run: |
          cd dist/workbuddy
          zip -qr "huaweicloud-plugin.zip" huaweicloud-plugin
          cd ../..
          echo "ASSET=dist/workbuddy/huaweicloud-plugin.zip" >> "$GITHUB_ENV"

      - name: Commit dist changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/workbuddy/
          if git diff --cached --quiet; then
            echo "No dist changes for this build"
            exit 0
          fi
          git commit -m "build: workbuddy package v${{ steps.version.outputs.version }} (source: ${{ env.SOURCE_REPO }}@${{ env.SOURCE_REF }})"
          attempts=0
          until git push origin main; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 5 ]; then
              echo "::error::push failed after $attempts attempts"
              exit 1
            fi
            echo "push attempt $attempts rejected; rebasing and retrying"
            sleep $((attempts * 10))
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="workbuddy-v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$ASSET" \
            --title "WorkBuddy Expert Package v${VERSION}" \
            --notes "WorkBuddy expert package built from ${SOURCE_REPO}@${SOURCE_REF}. Upload the zip asset to the WorkBuddy store console to submit officially."

      - name: Mark npm version as built
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NPM_VERSION=$(npm view huaweicloud-devkit version || true)
          if [ "$VERSION" = "$NPM_VERSION" ]; then
            mkdir -p .state
            printf '%s' "$VERSION" > .state/last-built-npm-version
            git add .state/
            if ! git diff --cached --quiet; then
              git commit -m "chore: mark npm version ${VERSION} as built"
              git push
            fi
          else
            echo "Built version ${VERSION} differs from npm ${NPM_VERSION}; state not updated"
          fi

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## WorkBuddy package v${VERSION}"
            echo ""
            echo "- Source: \`${SOURCE_REPO}@${SOURCE_REF}\`"
            echo "- Dist: \`dist/workbuddy/huaweicloud-plugin/\` (committed)"
            echo "- Release: \`workbuddy-v${VERSION}\` with zip asset"
            echo ""
            echo "**Official submission**: download the zip asset and upload it to the WorkBuddy store console (manual step; replace this job with an API integration when available)."
          } >> "$GITHUB_STEP_SUMMARY"

  build-clawhub:
    runs-on: ubuntu-latest
    # ClawHub package = the npm tarball's plugins/huaweicloud-core directory as-is
    # (openclaw.plugin.json + skills/ + src/ + ...). Built straight from the npm
    # registry tarball, so content always matches the npm version exactly.
    env:
      INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}
    steps:
      - name: Checkout dist repo
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # npm registry is the single source of truth for the package version
            VERSION=$(npm view huaweicloud-devkit version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ClawHub package at version $VERSION (from npm registry tarball)"

      - name: Build ClawHub package
        run: node scripts/build-clawhub.mjs --version "${{ steps.version.outputs.version }}"

      - name: Zip package
        run: |
          cd dist/clawhub
          zip -qr "huaweicloud-devkit.zip" huaweicloud-core
          cd ../..
          echo "ASSET=dist/clawhub/huaweicloud-devkit.zip" >> "$GITHUB_ENV"

      - name: Commit dist changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/clawhub/
          if git diff --cached --quiet; then
            echo "No dist changes for this build"
            exit 0
          fi
          git commit -m "build: clawhub package v${{ steps.version.outputs.version }} (source: npm registry)"
          attempts=0
          until git push origin main; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 5 ]; then
              echo "::error::push failed after $attempts attempts"
              exit 1
            fi
            echo "push attempt $attempts rejected; rebasing and retrying"
            sleep $((attempts * 10))
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="clawhub-v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$ASSET" \
            --title "ClawHub Package v${VERSION}" \
            --notes "ClawHub package (plugins/huaweicloud-core from npm registry). Install: openclaw plugins install clawhub:huaweicloud-devkit"

  publish-clawhub:
    name: Publish to ClawHub (official channel)
    needs: build-clawhub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Official submission IS automated for ClawHub (clawhub CLI), but only runs
    # when the repo admin has configured:
    #   - variable CLAWHUB_ENABLED = true
    #   - secret   CLAWHUB_TOKEN  (ClawHub login token)
    if: ${{ vars.CLAWHUB_ENABLED == 'true' }}
    steps:
      - name: Checkout dist repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install clawhub CLI
        run: npm install -g clawhub

      - name: Login to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN"

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./dist/clawhub/huaweicloud-core/openclaw.plugin.json').version")
          clawhub package publish dist/clawhub/huaweicloud-core \
            --family bundle-plugin \
            --name huaweicloud-devkit \
            --display-name "HuaweiCloud DevKit" \
            --version "$VERSION" \
            --bundle-format codex \
            --owner huaweicloud \
            --json

      - name: Summary
        run: |
          {
            echo "## ClawHub official submission"
            echo ""
            echo "- Package: \`clawhub:huaweicloud-devkit\`"
            echo "- Install: \`openclaw plugins install clawhub:huaweicloud-devkit\`"
          } >> "$GITHUB_STEP_SUMMARY"

  runtime-compat:
    runs-on: ubuntu-latest
    # Runtime compatibility monitor: extract the devkit package's runtime
    # requirements (engines.node + second-runtime traces) from the npm tarball
    # and reconcile them against the agent runtime registry (runtimes.json).
    # Runs on every build — i.e. whenever the npm version changes (auto-build
    # poller) or a build is triggered manually. Agent registry updates (agent
    # upgrades) trigger a rebuild via workflow_dispatch.
    env:
      INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}
    steps:
      - name: Checkout dist repo
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(npm view huaweicloud-devkit version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check runtime compatibility
        run: node scripts/check-runtime-compat.mjs --version "${{ steps.version.outputs.version }}"

      - name: Commit compat matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/runtime-compat/
          if git diff --cached --quiet; then
            echo "No compat matrix changes"
            exit 0
          fi
          git commit -m "chore: runtime compat matrix for devkit v${{ steps.version.outputs.version }}"
          attempts=0
          until git push origin main; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 5 ]; then
              echo "::error::push failed after $attempts attempts"
              exit 1
            fi
            echo "push attempt $attempts rejected; rebasing and retrying"
            sleep $((attempts * 10))
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done

      - name: Set incompatible flag
        run: |
          N=$(node -p "JSON.parse(require('fs').readFileSync('dist/runtime-compat/compat.json','utf8')).incompatible.length")
          echo "incompatible agents: $N"
          echo "INCOMPATIBLE=$N" >> "$GITHUB_ENV"

      - name: File incompatibility issue
        if: env.INCOMPATIBLE != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create runtime-compat -R "$GITHUB_REPOSITORY" --color D93F0B --description "Runtime incompatibility between devkit and an agent" || true
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --label runtime-compat --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --label runtime-compat --state open --json number --jq '.[0].number')
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body-file dist/runtime-compat/issue-body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label runtime-compat \
              --title "Runtime incompatibility: devkit v${{ steps.version.outputs.version }} exceeds an agent's bundled runtime" \
              --body-file dist/runtime-compat/issue-body.md
          fi
